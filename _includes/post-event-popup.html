<!-- Post-event popup (replaces the countdown). Shown once per browser session. -->
<div id="cbe-after" class="cbe-after" hidden>
  <style>
    .cbe-after{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,1,1,.74);font-family:'Lato',sans-serif}
    .cbe-after[hidden]{display:none}
    .cbe-after *{box-sizing:border-box}
    .cbe-after .cbe-card{position:relative;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:#1C1830;color:#EEEEEE;border:2px solid #E32DFD;border-radius:14px;padding:40px 28px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
    .cbe-after .cbe-close{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#EEEEEE;font-size:26px;line-height:1;cursor:pointer}
    .cbe-after .cbe-close:hover{background:rgba(238,238,238,.1)}
    .cbe-after h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:28px;line-height:1.2;letter-spacing:.01em;color:#FFFFFF;margin:0 0 14px;padding:0 24px;text-transform:none}
    .cbe-after .cbe-divider{width:80px;height:5px;margin:0 auto 18px;background:linear-gradient(to right,#0074A9 50%,#E32DFD 50%)}
    .cbe-after p{font-size:16px;line-height:1.55;color:#D8D6E0;margin:0 0 14px;letter-spacing:normal}
    .cbe-after .cbe-link{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
    .cbe-after .cbe-link:hover{color:#E32DFD}
    .cbe-after .cbe-follow{margin-top:22px;padding-top:20px;border-top:1px solid #3A3354}
    .cbe-after .cbe-close:focus-visible,.cbe-after .cbe-link:focus-visible{outline:3px solid #19F5FF;outline-offset:2px}
    .cbe-follow-label{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;margin:0 0 10px}
    .cbe-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
    .cbe-row-main{margin-top:18px}
    .cbe-social,.cbe-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;text-decoration:none;border-radius:10px;min-height:44px;padding:11px 18px;transition:background .15s,border-color .15s,color .15s}
    .cbe-social{color:#FFFFFF;border:1.5px solid #6B6780;background:transparent}
    .cbe-social:hover{border-color:#E32DFD;color:#FFFFFF;text-decoration:none}
    .cbe-btn{background:#E32DFD;color:#1A0322;border:1.5px solid #E32DFD}
    .cbe-btn:hover{background:#EC6BFE;border-color:#EC6BFE;color:#1A0322;text-decoration:none}
    .cbe-btn-ghost{background:transparent;color:#FFFFFF;border-color:#FFFFFF}
    .cbe-btn-ghost:hover{background:rgba(255,255,255,.08);border-color:#FFFFFF;color:#FFFFFF}
    .cbe-social:focus-visible,.cbe-btn:focus-visible{outline:3px solid #19F5FF;outline-offset:2px}
    @media (max-width:420px){.cbe-after .cbe-card{padding:36px 18px 24px}.cbe-after h2{font-size:24px}}
  </style>
  <div class="cbe-card" role="dialog" aria-modal="true" aria-labelledby="cbe-after-title">
    <button type="button" class="cbe-close" aria-label="Close">&times;</button>
    <h2 id="cbe-after-title">Thank you for Code BEAM Europe 2026!</h2>
    <div class="cbe-divider" aria-hidden="true"></div>
    <p>See you in 2027! Meanwhile, <a class="cbe-link cbe-close-link" href="#schedule">browse the 2026 programme</a> and watch for the recordings on YouTube.</p>

  <script>
  (function () {
    var KEY = 'cbe-after-seen';
    var root = document.getElementById('cbe-after');
    if (!root) return;
    try { if (sessionStorage.getItem(KEY)) return; } catch (e) {}
    var lastFocus = null;
    function close() {
      root.hidden = true;
      document.removeEventListener('keydown', onKey);
      try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    function open() {
      lastFocus = document.activeElement;
      root.hidden = false;
      document.addEventListener('keydown', onKey);
      root.querySelector('.cbe-close').focus();
    }
    root.addEventListener('click', function (e) { if (e.target === root) close(); });
    root.querySelector('.cbe-close').addEventListener('click', close);
    root.querySelectorAll('a[href^="#"]').forEach(function (a) { a.addEventListener('click', close); });
    setTimeout(open, 1500);
  })();
  </script>
