# ---------------------------------------------------------------------------
# Haarlem hotels for the #accommodation section.
# Edit here, the section on the page updates automatically.
#
#   published:   set false to hide a hotel without deleting it
#   stars:       whole number, rendered as filled stars
#   distance:    walking distance to PHIL (the venue), in km
#   price / unit / note:  the big number, its suffix, and a line under it
#   includes:    small pills. type: yes (green) | no (grey) | plain (neutral)
#   book_url:    if present, a solid "book" button; otherwise an email button
#   book_label:  text on the solid button (an arrow is added automatically)
#   email / phone: used for the "Email to book" button and the call line
# ---------------------------------------------------------------------------

